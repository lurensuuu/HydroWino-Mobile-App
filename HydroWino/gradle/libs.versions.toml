[versions]
android-gradle-plugin = "8.13.2"
androidx-activity = "1.12.3"
androidx-appcompat = "1.6.1"
androidx-material = "1.9.0"
constraintlayout = "2.1.4"
junit = "4.13.2"
androidx-ext-junit = "1.1.5"
espresso-core = "3.5.1"
google-gms-google-services = "4.4.1"
firebase-bom = "34.11.0"
camerax = "1.3.1"
glide = "4.16.0"
guava = "33.4.0-android"
play-services-auth = "21.2.0"
volley = "1.2.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "google-gms-google-services" }

[libraries]
activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
material = { module = "com.google.android.material:material", version.ref = "androidx-material" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
junit = { module = "junit:junit", version.ref = "junit" }
ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-ext-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-database = { group = "com.google.firebase", name = "firebase-database" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-storage = { group = "com.google.firebase", name = "firebase-storage" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-camera-extensions = { group = "androidx.camera", name = "camera-extensions", version.ref = "camerax" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
tensorflow-lite-support = { group = "org.tensorflow", name = "tensorflow-lite-support", version = "0.4.4" }
tensorflow-lite-metadata = { group = "org.tensorflow", name = "tensorflow-lite-metadata", version = "0.4.4" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "play-services-auth" }
volley = { module = "com.android.volley:volley", version.ref = "volley" }
